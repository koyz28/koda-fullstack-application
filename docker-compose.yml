name: project-tracker

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-project_tracker}
      MYSQL_USER: ${DB_USERNAME:-tracker}
      MYSQL_PASSWORD: ${DB_PASSWORD:-tracker}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: "Project Tracker"
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:8080}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-project_tracker}
      DB_USERNAME: ${DB_USERNAME:-tracker}
      DB_PASSWORD: ${DB_PASSWORD:-tracker}
      SESSION_DRIVER: array
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    volumes:
      # Sample data from the assessment, read by ProjectSeeder via base_path('../test_data.json').
      - ./test_data.json:/var/www/test_data.json:ro

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-8080}:80"

volumes:
  db-data:
